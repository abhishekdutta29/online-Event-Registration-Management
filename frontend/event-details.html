<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details - EventVibe</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Style -->
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Navigation bar (dynamically rendered by app.js) -->
  <header></header>

  <main class="container my-5">
    <div class="mb-4">
      <a href="/index.html" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left me-2"></i>Back to Browse Events</a>
    </div>

    <!-- Error state -->
    <div id="error-container" class="glass-card p-5 text-center d-none">
      <i class="bi bi-calendar-x fs-1 text-danger mb-3 d-block"></i>
      <h3>Event Not Found</h3>
      <p class="text-secondary">The event you are looking for does not exist or has been deleted.</p>
    </div>

    <!-- Details View -->
    <div id="details-container" class="row">
      <!-- Left side: Description & Info -->
      <div class="col-lg-8 mb-4">
        <div class="glass-card h-100 overflow-hidden">
          <img id="event-image" src="" alt="Event Image" class="w-100" style="height: 300px; object-fit: cover; border-bottom: 1px solid var(--card-border);">
          <div class="p-4 p-md-5">
            <div class="mb-3">
              <span id="event-category" class="event-tag tag-default">Category</span>
            </div>
            <h1 id="event-title" class="text-light mb-4 display-5 fw-bold">Event Title</h1>
            
            <h5 class="text-light mb-3">About This Event</h5>
            <p id="event-description" class="text-secondary lead" style="white-space: pre-line;">Event description goes here...</p>
          </div>
        </div>
      </div>

      <!-- Right side: Registration Sidebar -->
      <div class="col-lg-4 mb-4">
        <div class="glass-card p-4">
          <h4 class="text-light mb-4">Event Info</h4>

          <!-- Date -->
          <div class="event-meta-item">
            <div class="event-meta-icon"><i class="bi bi-calendar3"></i></div>
            <div>
              <div class="small text-secondary">Date</div>
              <strong id="event-date" class="text-light">-</strong>
            </div>
          </div>

          <!-- Time -->
          <div class="event-meta-item">
            <div class="event-meta-icon"><i class="bi bi-clock"></i></div>
            <div>
              <div class="small text-secondary">Time</div>
              <strong id="event-time" class="text-light">-</strong>
            </div>
          </div>

          <!-- Location -->
          <div class="event-meta-item">
            <div class="event-meta-icon"><i class="bi bi-geo-alt"></i></div>
            <div>
              <div class="small text-secondary">Location</div>
              <strong id="event-location" class="text-light">-</strong>
            </div>
          </div>

          <!-- Capacity -->
          <div class="event-meta-item border-top border-secondary pt-3 mt-3" style="border-color: rgba(255,255,255,0.05) !important;">
            <div class="event-meta-icon"><i class="bi bi-people"></i></div>
            <div class="w-100">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="small text-secondary">Available Seats</span>
                <span id="event-spots-text" class="small fw-bold text-success">-</span>
              </div>
              <div class="spot-bar mt-2">
                <div id="event-spots-bar" class="spot-bar-fill" style="width: 0%"></div>
              </div>
            </div>
          </div>

          <!-- Registration Button -->
          <div class="mt-4 border-top border-secondary pt-3" style="border-color: rgba(255,255,255,0.05) !important;">
            <div id="registration-action-container">
              <button class="btn btn-primary-glow w-100 py-3 disabled" id="register-btn">Loading registration...</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 border-top border-secondary mt-5" style="border-color: rgba(255,255,255,0.05) !important;">
    <p class="text-secondary mb-0">&copy; 2026 EventVibe. All rights reserved.</p>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App utilities -->
  <script src="/js/app.js"></script>

  <script>
    let eventId = null;
    let eventData = null;
    let userRegistration = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      eventId = params.get('id');

      if (!eventId) {
        showErrorState();
        return;
      }

      await loadEventDetails();
    });

    function showErrorState() {
      document.getElementById('details-container').classList.add('d-none');
      document.getElementById('error-container').classList.remove('d-none');
    }

    async function loadEventDetails() {
      try {
        eventData = await fetchAPI(`/api/events/${eventId}`);
        
        // Populate view
        document.getElementById('event-image').src = eventData.image_url || '/images/tech_conf.png';
        document.getElementById('event-image').alt = eventData.title;
        document.getElementById('event-title').textContent = eventData.title;
        document.getElementById('event-description').textContent = eventData.description || 'No description provided for this event.';
        
        const catBadge = document.getElementById('event-category');
        catBadge.textContent = eventData.category;
        catBadge.className = `event-tag ${getCategoryTagClass(eventData.category)}`;

        // Format Date
        const dateObj = new Date(eventData.date);
        document.getElementById('event-date').textContent = dateObj.toLocaleDateString('en-US', {
          weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
        });

        // Format Time
        document.getElementById('event-time').textContent = eventData.time.substring(0, 5);
        document.getElementById('event-location').textContent = eventData.location;

        // Capacity
        const percentage = ((eventData.capacity - eventData.spots_left) / eventData.capacity) * 100;
        document.getElementById('event-spots-bar').style.width = `${percentage}%`;
        
        const spotsText = document.getElementById('event-spots-text');
        if (eventData.spots_left === 0) {
          spotsText.textContent = 'Sold Out';
          spotsText.className = 'small fw-bold text-danger';
        } else {
          spotsText.textContent = `${eventData.spots_left} / ${eventData.capacity} spots remaining`;
          spotsText.className = eventData.spots_left < 10 ? 'small fw-bold text-warning' : 'small fw-bold text-success';
        }

        // Handle Auth and Registration button state
        await updateRegistrationButton();

      } catch (err) {
        showErrorState();
      }
    }

    async function updateRegistrationButton() {
      const container = document.getElementById('registration-action-container');
      const user = getUser();

      if (!user) {
        // User not logged in
        container.innerHTML = `
          <a href="/login.html" class="btn btn-primary-glow w-100 py-3"><i class="bi bi-box-arrow-in-right me-2"></i>Log In to Register</a>
        `;
        return;
      }

      try {
        // Fetch current user registrations
        const registrations = await fetchAPI('/api/registrations/my');
        // Find if user has registered for this event
        userRegistration = registrations.find(r => r.event_id == eventId);

        if (userRegistration && userRegistration.status === 'confirmed') {
          container.innerHTML = `
            <div class="alert alert-success text-center border-0 p-3" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">
              <i class="bi bi-check-circle-fill me-2"></i>You are registered for this event!
            </div>
            <a href="/dashboard.html" class="btn btn-outline-glass w-100 py-2 mt-2"><i class="bi bi-speedometer2 me-2"></i>View in Dashboard</a>
          `;
        } else if (eventData.spots_left === 0) {
          container.innerHTML = `
            <button class="btn btn-secondary w-100 py-3 disabled" style="background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid var(--card-border);">
              <i class="bi bi-slash-circle me-2"></i>Registration Closed (Capacity Reached)
            </button>
          `;
        } else {
          // Can register (or re-register)
          container.innerHTML = `
            <button class="btn btn-primary-glow w-100 py-3" id="register-btn">
              <i class="bi bi-ticket-perforated me-2"></i>Register for Event
            </button>
          `;

          document.getElementById('register-btn').addEventListener('click', handleRegistration);
        }
      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-danger text-center border-0 p-3 small" style="background: rgba(239, 68, 68, 0.15); color: #f87171;">
            Failed to verify registration status.
          </div>
        `;
      }
    }

    async function handleRegistration() {
      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Registering...`;

      try {
        await fetchAPI('/api/registrations', {
          method: 'POST',
          body: JSON.stringify({ eventId })
        });

        showAlert('Successfully registered for event!', 'success');
        
        // Reload details to show updated seats and button state
        await loadEventDetails();
      } catch (err) {
        showAlert(err.message || 'Registration failed.', 'danger');
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-ticket-perforated me-2"></i>Register for Event`;
      }
    }
  </script>
</body>
</html>
