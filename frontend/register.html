<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EventVibe</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Style -->
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Navigation bar (dynamically rendered by app.js) -->
  <header></header>

  <main class="container my-5 py-5">
    <div class="row">
      <div class="col-md-6 col-lg-5 mx-auto">
        <div class="card glass-card p-4">
          <div class="card-body">
            <h2 class="text-center text-light mb-4">Create Account</h2>
            <p class="text-center text-secondary mb-4">Sign up to start discovering and registering for events.</p>
            
            <form id="register-form">
              <!-- Username -->
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control form-glass" id="username" required placeholder="Choose a username">
              </div>

              <!-- Email Address -->
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control form-glass" id="email" required placeholder="name@example.com">
              </div>
              
              <!-- Password -->
              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control form-glass" id="password" required placeholder="Create a password (min 6 chars)">
              </div>
              
              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary-glow w-100 py-2 mb-3">Sign Up</button>
            </form>

            <div class="text-center mt-3">
              <span class="text-secondary">Already have an account? </span>
              <a href="/login.html" class="text-light fw-bold text-decoration-none">Log In</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App utilities -->
  <script src="/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      if (getUser()) {
        window.location.href = '/index.html';
      }

      const form = document.getElementById('register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (password.length < 6) {
          showAlert('Password must be at least 6 characters long.', 'warning');
          return;
        }

        try {
          await fetchAPI('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({ username, email, password })
          });

          showAlert('Account created successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } catch (err) {
          showAlert(err.message || 'Registration failed. Try again.', 'danger');
        }
      });
    });
  </script>
</body>
</html>
