<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventVibe - Discover & Register for Upcoming Events</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Style -->
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Navigation bar (dynamically rendered by app.js) -->
  <header></header>

  <main class="container my-5">
    <!-- Hero Banner -->
    <div class="row mb-5">
      <div class="col-lg-8 mx-auto text-center">
        <h1 class="display-4 fw-extrabold mb-3" style="background: linear-gradient(to right, #a5b4fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Discover Amazing Events</h1>
        <p class="lead text-secondary">Join top conferences, local concerts, sports runs, food expos, and networking events. Book your spot today!</p>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="glass-card p-4 mb-5">
      <div class="row g-3">
        <!-- Search Input -->
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="form-control form-glass" placeholder="Search by title, location or description...">
          </div>
        </div>
        <!-- Search/Reset Buttons -->
        <div class="col-md-4 d-flex gap-2">
          <button id="search-btn" class="btn btn-primary-glow w-100"><i class="bi bi-search me-2"></i>Search</button>
          <button id="reset-btn" class="btn btn-outline-glass w-50">Reset</button>
        </div>
      </div>

      <!-- Categories Pills -->
      <div class="mt-4">
        <label class="form-label d-block mb-2">Filter by Category</label>
        <div id="categories-container" class="d-flex flex-wrap gap-2">
          <span class="filter-badge active" data-category="All">All</span>
          <!-- Dynamic categories will be loaded here -->
        </div>
      </div>
    </div>

    <!-- Event List Grid -->
    <div class="row" id="events-grid">
      <!-- Loading indicator -->
      <div class="col-12 text-center my-5" id="events-loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-secondary mt-2">Loading upcoming events...</p>
      </div>
      <!-- Dynamic event cards will be loaded here -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 border-top border-secondary mt-5" style="border-color: rgba(255,255,255,0.05) !important;">
    <p class="text-secondary mb-0">&copy; 2026 EventVibe. All rights reserved.</p>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App utilities -->
  <script src="/js/app.js"></script>
  
  <!-- Index Page Logic -->
  <script>
    let activeCategory = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      loadCategories();
      loadEvents();

      // Bind search click
      document.getElementById('search-btn').addEventListener('click', loadEvents);
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadEvents();
      });

      // Bind reset click
      document.getElementById('reset-btn').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        activeCategory = 'All';
        
        // Reset category UI badges
        document.querySelectorAll('.filter-badge').forEach(b => {
          if (b.getAttribute('data-category') === 'All') b.classList.add('active');
          else b.classList.remove('active');
        });

        loadEvents();
      });
    });

    async function loadCategories() {
      const container = document.getElementById('categories-container');
      try {
        const categories = await fetchAPI('/api/events/categories');
        categories.forEach(cat => {
          const badge = document.createElement('span');
          badge.className = 'filter-badge';
          badge.setAttribute('data-category', cat);
          badge.textContent = cat;
          
          badge.addEventListener('click', () => {
            document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('active'));
            badge.classList.add('active');
            activeCategory = cat;
            loadEvents();
          });

          container.appendChild(badge);
        });

        // Set listener on the default 'All' badge
        const allBadge = container.querySelector('[data-category="All"]');
        allBadge.addEventListener('click', () => {
          document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('active'));
          allBadge.classList.add('active');
          activeCategory = 'All';
          loadEvents();
        });
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    }

    async function loadEvents() {
      const grid = document.getElementById('events-grid');
      const loader = document.getElementById('events-loading');
      
      grid.innerHTML = '';
      if (loader) grid.appendChild(loader);

      const search = document.getElementById('search-input').value.trim();
      
      let query = `?`;
      if (search) query += `search=${encodeURIComponent(search)}&`;
      if (activeCategory && activeCategory !== 'All') query += `category=${encodeURIComponent(activeCategory)}&`;

      try {
        const events = await fetchAPI(`/api/events${query}`);
        
        // Remove loader
        if (loader) loader.remove();

        if (events.length === 0) {
          grid.innerHTML = `
            <div class="col-12 text-center my-5 py-5 glass-card">
              <i class="bi bi-calendar-x fs-1 text-secondary mb-3 d-block"></i>
              <h3>No events found</h3>
              <p class="text-secondary">Try adjusting your filters or search keywords.</p>
            </div>
          `;
          return;
        }

        events.forEach(event => {
          const col = document.createElement('div');
          col.className = 'col-md-6 col-lg-4 mb-4';

          const categoryClass = getCategoryTagClass(event.category);
          
          // Format date
          const dateObj = new Date(event.date);
          const formattedDate = dateObj.toLocaleDateString('en-US', {
            weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
          });

          // Spots percentage calculation
          const percentage = ((event.capacity - event.spots_left) / event.capacity) * 100;
          const spotsText = event.spots_left === 0 ? 'Sold Out' : `${event.spots_left} / ${event.capacity} spots left`;
          const textClass = event.spots_left === 0 ? 'text-danger fw-bold' : (event.spots_left < 10 ? 'text-warning fw-bold' : 'text-success');

          const eventImg = event.image_url || '/images/tech_conf.png';
          col.innerHTML = `
            <div class="card glass-card h-100 overflow-hidden">
              <img src="${eventImg}" class="card-img-top" alt="${event.title}" style="height: 180px; object-fit: cover; border-bottom: 1px solid var(--card-border);">
              <div class="card-body d-flex flex-column p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <span class="event-tag ${categoryClass}">${event.category}</span>
                  <small class="text-secondary"><i class="bi bi-geo-alt-fill me-1"></i>${event.location.split(',')[0]}</small>
                </div>
                <h4 class="card-title text-light mb-2">${event.title}</h4>
                <p class="card-text text-secondary mb-4 flex-grow-1">${event.description.length > 100 ? event.description.substring(0, 100) + '...' : event.description}</p>
                
                <div class="border-top border-secondary pt-3 mt-auto" style="border-color: rgba(255,255,255,0.05) !important;">
                  <div class="d-flex align-items-center mb-2">
                    <i class="bi bi-calendar3 text-indigo me-2"></i>
                    <span class="small text-light">${formattedDate} at ${event.time.substring(0, 5)}</span>
                  </div>
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="small text-secondary">Spots</span>
                    <span class="small ${textClass}">${spotsText}</span>
                  </div>
                  <div class="spot-bar mb-3">
                    <div class="spot-bar-fill" style="width: ${percentage}%"></div>
                  </div>
                  <a href="/event-details.html?id=${event.id}" class="btn btn-primary-glow w-100">View Details</a>
                </div>
              </div>
            </div>
          `;
          grid.appendChild(col);
        });
      } catch (err) {
        if (loader) loader.remove();
        grid.innerHTML = `
          <div class="col-12 text-center my-5 py-5 glass-card">
            <i class="bi bi-exclamation-triangle fs-1 text-danger mb-3 d-block"></i>
            <h3>Failed to load events</h3>
            <p class="text-secondary">${err.message || 'There was an error communicating with the server.'}</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
